name: Release Verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run verify:release

  smoke-production:
    runs-on: ubuntu-latest
    needs: verify-release
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build current shell for smoke comparison
        run: npm run build

      - name: Wait for production deploy
        run: sleep 60

      - name: Smoke production
        env:
          PROD_SMOKE_RETRIES: '8'
          PROD_SMOKE_RETRY_DELAY_MS: '20000'
        run: npm run smoke:prod
